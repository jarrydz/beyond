name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one in-flight deploy; queue the next, but don't cancel a running one
# halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      - name: Build
        env:
          # Pages serves at /<repo>/ — Vite needs a matching base so asset URLs resolve.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      # Whichever attempt succeeds provides the URL.
      url: ${{ steps.deploy-1.outputs.page_url || steps.deploy-2.outputs.page_url || steps.deploy-3.outputs.page_url || steps.deploy-4.outputs.page_url || steps.deploy-5.outputs.page_url }}
    steps:
      # GitHub Pages intermittently returns a transient "Deployment failed, try
      # again later", and the flake has outlasted a single 30s retry — a manual
      # re-run minutes later always succeeded. So: five attempts with
      # exponential backoff (10s → 20s → 40s → 80s ≈ 2.5 min of cover).
      #
      # Each attempt is gated on the PREVIOUS attempt having failed; once one
      # succeeds the rest are skipped (skipped ≠ failure), so a green run
      # deploys exactly once. Every attempt re-publishes the same built
      # artifact and Pages deployments swap atomically — no half-deployed
      # state. The final attempt has no continue-on-error, so a genuinely
      # broken deploy still fails the job loudly.
      - name: Deploy (attempt 1 of 5)
        id: deploy-1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Backoff 10s
        if: steps.deploy-1.outcome == 'failure'
        run: echo "::warning::Deploy attempt 1 failed (likely transient) — retrying in 10s" && sleep 10

      - name: Deploy (attempt 2 of 5)
        id: deploy-2
        if: steps.deploy-1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Backoff 20s
        if: steps.deploy-2.outcome == 'failure'
        run: echo "::warning::Deploy attempt 2 failed — retrying in 20s" && sleep 20

      - name: Deploy (attempt 3 of 5)
        id: deploy-3
        if: steps.deploy-2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Backoff 40s
        if: steps.deploy-3.outcome == 'failure'
        run: echo "::warning::Deploy attempt 3 failed — retrying in 40s" && sleep 40

      - name: Deploy (attempt 4 of 5)
        id: deploy-4
        if: steps.deploy-3.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Backoff 80s
        if: steps.deploy-4.outcome == 'failure'
        run: echo "::warning::Deploy attempt 4 failed — retrying in 80s" && sleep 80

      - name: Deploy (attempt 5 of 5 — final)
        id: deploy-5
        if: steps.deploy-4.outcome == 'failure'
        uses: actions/deploy-pages@v4
